project: pi-subagent-monitor
stack:
  language: typescript
  runtime: node>=22.5
  build: tsup
  entry: src/index.ts
  tui: "@earendil-works/pi-tui"
  storage: node:sqlite (read-only polling)
artifact_store: openspec
change_root: openspec/changes/
conventions:
  commits: chore|feat|fix|docs|test|refactor
  scopes: monitor|drawer|db|ui|tests|build
  pr_style: single PR unless review budget forces split
testing:
  runner: vitest
  strict_tdd: true
  command: npm test
  coverage_target: lines >= 70 on new components
  harness:
    path: test-harness/
    purpose: Prepare reproducible SQLite scenarios; not a test runner.
phase_rules:
  proposal_required: true
  spec_required: true
  design_required: true
  tasks_required: true
  apply_style: strict_tdd
  verify_required: true
  sync_required: true
  archive_required: true